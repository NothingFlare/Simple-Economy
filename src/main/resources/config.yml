# Язык плагина.
# Доступные языки: en, ru, zh, de, fr, es, pt, ja, uk, it, pl, tr, ko
language: "ru"

# Настройка отображения валюты
# Вы можете настроить символ и формат отображения.
# Примеры format:
#   "%amount%%symbol%"   -> "60$" или "60р"
#   "%amount% %symbol%"  -> "60 руб."
#   "%amount%(%symbol%)" -> "60(долларов)"
#   "%symbol%%amount%"   -> "$60"
currency:
  symbol: "$"
  format: "%amount%%symbol%"

# Звуковые эффекты в меню и действиях (клик, смена страницы, покупка, продажа)
sounds:
  enabled: true

# Проверка обновлений через GitHub API
check_updates: true

# Включение и выключение отдельных модулей (по умолчанию всё включено)
modules:
  shop: true     # Игровой магазин (/shop)
  auction: true  # Аукцион (/ah)
  buyer: true    # Скупщик предметов (/buyer)

# Настройка базы данных
# Поддерживаемые типы: sqlite, mysql (или mariadb)
database:
  type: "sqlite"
  sqlite:
    file: "database.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "simple_economy"
    username: "root"
    password: ""
    pool-size: 10
    connection-timeout: 30000

# Настройки Аукциона (/ah)
auction:
  # Максимальное количество одновременно активных лотов у одного игрока
  max_slots: 5
  # Кулдаун перед следующим выставлением предмета на аукцион (в секундах, 0 - без кулдауна)
  listing_cooldown_seconds: 0
  # Задержка перед появлением предмета на аукционе (в секундах)
  # При выставлении лот сначала появляется в слотах с таймером обратного отсчета
  publish_delay_seconds: 5
  # Сколько часов предмет хранится на аукционе до истечения срока
  expire_hours: 48
  # Минимальная допустимая цена лота
  min_price: 1.0
  # Максимальная допустимая цена лота
  max_price: 100000000.0
  # Белый список администраторов для команды /ah admin
  # Доступ к /ah admin имеют только операторы (ОП). Если включен данный параметр,
  # никнейм ОП также должен быть указан в списке ниже.
  admin_whitelist:
    # Включить ли белый список администраторов (по умолчанию выключено)
    enabled: false
    # Список никнеймов администраторов
    players:
      - "Admin"
      - "Owner"

# Настройки Скупщика (/buyer)
buyer:
  # Воспроизводить ли звук при успешной продаже предметов
  sound_enabled: true
  # Выбрасывать ли оставшиеся предметы на землю при закрытии окна, если инвентарь полон
  drop_items_on_close_if_full: true

  # Ротация и блокировка предметов у скупщика
  # Ограничение доступного ассортимента (например, разрешить сдачу только 10% предметов)
  item_lock:
    # Включена ли ротация / блокировка части предметов у скупщика (по умолчанию включено)
    enabled: true
    # Процент разрешенных к продаже товаров от общего числа (от 0 до 100, по умолчанию 10%)
    # Например: 10 означает, что скупщик принимает 10% товаров из каталога
    allowed_percentage: 10.0
    # Интервал периодической смены доступных товаров (в часах, 0 - без автоматической смены по времени)
    # Например: 24 - каждые 24 часа доступные 10% товаров сменяются на следующие
    rotation_interval_hours: 24
    # Право для обхода блокировки товаров (возможность сдать любой предмет из базы скупщика)
    bypass_permission: "simpleeconomy.buyer.bypass"

# Настройки Магазина (/shop)
shop:
  # Закрывать ли меню магазина после успешной покупки товара
  close_on_buy: false

  # Блокировка предметов в категориях магазина
  # Позволяет ограничить доступ к части ассортимента (например, разрешить только первые N% предметов)
  item_lock:
    # Включена ли блокировка части предметов в категориях (по умолчанию выключено)
    enabled: false
    # Процент разрешенных (доступных) товаров от общего числа в категории (от 0 до 100)
    # Например: 70 означает, что первые 70% предметов доступны к покупке, а остальные заблокированы
    allowed_percentage: 100
    # Интервал периодической смены доступных товаров (в часах, 0 - выключено, товары фиксированы)
    rotation_interval_hours: 0
    # Право для обхода блокировки товаров
    bypass_permission: "simpleeconomy.shop.bypass"

# Динамическая рыночная экономика (скользящее временное окно спроса и предложения)
# При покупках в магазине (/shop) цена растет от спроса.
# При сдаче скупщику (/buyer) цена падает от перенасыщения рынка.
# Каждое изменение фиксируется в часовом интервале и ровно через N часов (по умолчанию 24)
# влияние конкретного часа сгорает, а цена возвращается назад (например: в 12:00 продали 64 шт -> -2%,
# в 13:00 продали 64 шт -> -4%, на следующий день в 12:00 вернется +2% и станет -2%, а в 13:00 вернется еще +2% и станет 0%).
dynamic_market:
  # Включена ли динамическая рыночная экономика
  enabled: true
  # Режим жесткого рынка без ограничений на рост и падение цен (hardcore dynamic market)
  # true - цены могут расти бесконечно от высокого спроса и падать до минимума ($0.01) от перенасыщения
  # false - действуют мягкие ограничения (min_price_multiplier и max_price_multiplier)
  hardcore_mode: true
  # Минимальная допустимая цена предмета (защита от отрицательных цен и нуля, по умолчанию 0.01)
  absolute_min_price: 0.01
  # Процент изменения цены за 1 стак предметов (64 штуки)
  # Например: ровно 2.0 означает, что за каждые 64 проданных или купленных предмета цена изменяется ровно на 2%
  percent_per_stack: 2.0
  # Длительность действия изменения цены (в часах, по умолчанию 24)
  # По истечении этого времени изменение цены за конкретный часовой интервал сгорает и возвращается назад
  impact_duration_hours: 24
  # Минимальный множитель цены от базовой (используется только если hardcore_mode: false)
  min_price_multiplier: 0.5
  # Максимальный множитель цены от базовой (используется только если hardcore_mode: false)
  max_price_multiplier: 3.0
  # Отображать ли тренды цен в описании предметов в меню магазина и скупщика
  show_trends: true
  # Защита от арбитража: максимальное отношение цены скупки (/buyer) к цене покупки в магазине (/shop)
  # Например, 0.75 означает, что скупщик никогда не заплатит больше 75% от текущей цены магазина (гарантирует невозможность дюпа денег через покупку в магазине и сдачу в скупщик)
  max_buyer_payout_ratio: 0.75

# Логирование покупок и транзакций (в консоль, файл purchases.log и базу данных)
logging:
  # Записывать ли каждую покупку в консоль сервера
  console: true
  # Записывать ли каждую покупку в отдельный файл логов (plugins/SimpleEconomy/logs/purchases.log)
  file: true
  # Записывать ли каждую покупку в базу данных (таблица se_purchase_logs)
  database: true
