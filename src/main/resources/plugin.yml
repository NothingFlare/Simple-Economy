name: SimpleEconomy
version: '${project.version}'
main: ru.nothingflare.simpleeconomy.SimpleEconomyPlugin
api-version: '1.20'
author: NothingFlare
depend:
  - Vault
folia-supported: true

commands:
  ah:
    description: Open auction house or list items
    aliases: [auction]
    permission: simpleeconomy.auction.use
    usage: /<command> [sell <price>]
  buyer:
    description: Open scrap buyer
    aliases: [scrapper, sell]
    permission: simpleeconomy.buyer.use
    usage: /<command>
  shop:
    description: Open server shop
    aliases: [eshop]
    permission: simpleeconomy.shop.use
    usage: /<command>
  simpleeconomy:
    description: Main plugin command
    aliases: [se]
    permission: simpleeconomy.admin
    usage: /<command> [reload]

permissions:
  simpleeconomy.auction.use:
    description: Allows using /ah
    default: true
  simpleeconomy.buyer.use:
    description: Allows using /buyer
    default: true
  simpleeconomy.shop.use:
    description: Allows using /shop
    default: true
  simpleeconomy.admin:
    description: Admin commands and management
    default: op
